<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'"><title>一隅 · 小窗</title><link rel="stylesheet" href="mini.css"></head><body><header><button id="open-main" title="打开专注空间">一隅</button><span id="tiny-time">15:00</span><div><button id="collapse" aria-label="收起悬浮窗">−</button><button id="hide" aria-label="隐藏悬浮窗">×</button></div></header><section id="normal"><div class="clock-row"><strong id="mini-time">15:00</strong><button id="capture" title="暂存念头">记个念头</button></div><p id="mini-goal"></p><div class="actions"><small id="mini-course"></small><button id="toggle">暂停</button><button id="finish">结束</button></div><div id="mini-soft" hidden><button id="paragraph">读完这段</button><button id="extend">再 5 分钟</button></div></section><form id="capture-form" hidden><label for="capture-input">先放在这里，接着学。</label><input id="capture-input" maxlength="1000" placeholder="突然惦记的事…" autocomplete="off"><p id="capture-goal"></p><div class="actions"><button type="button" id="cancel">取消</button><button type="submit" class="save">记下并返回</button></div></form><p id="mini-error" role="status" hidden></p><script type="module" src="mini.mjs"></script></body></html>
