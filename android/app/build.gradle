plugins { id 'com.android.application' }
def signingFile = rootProject.file('signing.properties')
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
android {
 namespace 'local.yiyu.focus'
 compileSdk 36
 defaultConfig { applicationId 'local.yiyu.focus'; minSdk 26; targetSdk 36; versionCode 700; versionName '0.7.0'; testInstrumentationRunner 'local.yiyu.focus.NativeChecks' }
 buildFeatures { buildConfig true }
 compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { release { if(signingFile.exists()) { storeFile file(signingValues.storeFile); storePassword signingValues.storePassword; keyAlias signingValues.keyAlias; keyPassword signingValues.keyPassword } } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'; implementation 'com.squareup.okhttp3:okhttp:4.12.0'; implementation 'androidx.activity:activity:1.10.1' }
